name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Anki-Video-Player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.$GITHUB_RUN_NUMBER"
          file="Anki-Video-Player-$tag.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$file"
          gh release create "$tag" "$file" --title "Anki Video Player $tag (preview)" --prerelease --notes "First functional Android preview. Local files, direct media URLs, SRT/VTT/ASS word selection, manual/Gemini JSON dictionary, AnkiDroid share. Debug-signed build: future updates may require reinstalling."
